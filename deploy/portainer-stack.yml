# Docker Swarm stack for Portainer.
#
# The service runs on the host's own network, with no publishing at all.
#
# This is not a preference, it is the only arrangement that works. The relay
# tracks every peer by source address, and it has to send to a client long after
# that client last spoke. Anything that rewrites the source breaks both halves.
# Publishing in host mode is not enough: the container still sits on an overlay,
# and traffic that reaches it through Docker's proxy path arrives from the
# docker_gwbridge gateway instead of from the client. Every remote client then
# looks like 10.0.1.1, and replies go to the bridge rather than to the phone.
# The LAN module survives that because it hits the DNAT path directly; a client
# arriving any other way does not, which is a difference you only find in
# production.
#
# On the host network there is no DNAT, no masquerade and no proxy, so the relay
# sees exactly what was sent and replies go straight back.
#
# The service is pinned to one node because the DNS override for
# intouch.geckoal.com / intouch2.geckoal.com has to resolve to a fixed address.
# Move both together or the module will talk to a node with nothing listening.
#
# It must NOT be the node running Home Assistant, or anything else that speaks
# in.touch2. Only one process on a host can hold UDP 10022, and the module
# answers to that port whatever port asked, so whoever owns the socket receives
# everybody's replies. Co-located with Home Assistant, this relay silently ate
# geckolib's traffic and the integration simply stopped working.

services:
  gecko-relay:
    image: ghcr.io/livehybrid/gecko-cloud-relay:latest
    environment:
      GECKO_PORT: "10022"
      GECKO_WEB_PORT: "8080"
      GECKO_LOG_SIZE: "500"
      # TEMPORARY, 2026-08-08. The poller became a fully registered pack client
      # and Home Assistant lost the spa minutes later, RF signal falling from
      # ~50 to 1. Two clients pulling the whole 637-byte block over the same
      # narrow RF link to the pack is the suspect. Off until that is understood;
      # Home Assistant matters more than this dashboard.
      GECKO_NO_POLL: "1"
      # Also forward to Gecko's own service, so the app still works from
      # outside the network. Local control does not depend on this: the module
      # is answered here first and only then passed on.
      GECKO_UPSTREAM: "intouch2.geckoal.com"
      # Resolve that name somewhere honest. Our own DNS points it back at this
      # relay, which is the entire point of the exercise and would otherwise
      # make it forward to itself.
      GECKO_UPSTREAM_DNS: "1.1.1.1"
      # Pin once known, so the module is identified on its first keepalive
      # instead of waiting for discovery.
      # GECKO_SPA_ID: "SPA80:1f:12:50:a5:d1"
      # GECKO_VERBOSE: "1"
    networks:
      - hostnet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          # NOT hpelite: Home Assistant is there and needs UDP 10022 itself.
          - node.labels.name==n1001
      restart_policy:
        condition: any
        delay: 10s
      # Two tasks cannot hold port 10022 at once, so the old one has to let go
      # before the new one starts.
      update_config:
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Docker's own host network, joined rather than created.
  hostnet:
    external: true
    name: host
